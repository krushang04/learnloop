server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths fall back to the SPA shell rather
  # than 404ing, so a deep link like /admin/videos/:id works on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
