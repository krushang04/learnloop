# Local development stack.
#
#   docker compose up -d mongo     → just the database (run the apps with npm)
#   docker compose --profile full up --build  → database + API + web
services:
  mongo:
    image: mongo:7
    container_name: learnloop-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnloop-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: development
      API_PREFIX: api
      # `mongo` is the service name on the compose network, not localhost.
      MONGODB_URI: mongodb://mongo:27017/learnloop
      JWT_SECRET: super-secret-dev-key-change-me
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - '4000:4000'

  web:
    profiles: ['full']
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    container_name: learnloop-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  mongo-data:
